name: AgentGate CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentgate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install / Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build source archive and wheel
        run: python -m build --no-isolation
      - name: Upload exact build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentgate-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Record build summary
        run: |
          echo '## Install / Build — SUCCESS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Built wheel and source archive from the current commit.' >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist/* >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test built wheel
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download artifacts from Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentgate-dist
          path: dist
      - name: Install locked dependencies and built wheel
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - name: Verify installed package is under test
        run: |
          python -c "import agentgate; print(agentgate.__file__); assert 'site-packages' in agentgate.__file__"
      - name: Run automated tests
        run: python -m pytest -v --junitxml=reports/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentgate-test-results
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Record test summary
        if: success()
        run: |
          python - <<'PY'
          import os
          from xml.etree import ElementTree as ET
          suites = ET.parse('reports/pytest.xml').getroot().iter('testsuite')
          total = sum(int(s.attrib['tests']) for s in suites)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'## Test — SUCCESS\n\n{total} automated tests passed against the built wheel.\n')
          PY
